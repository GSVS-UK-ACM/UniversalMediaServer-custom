#----------------------------------------------------------------------------
# Profile for VLC on a Samsung Galaxy S24 Ultra.
# Based on Google-Android.conf.
# See DefaultRenderer.conf for descriptions of all available options.
#

RendererName = Phone VLC
RendererIcon = android.png
UserAgentSearch = S928B
LoadingPriority = 2

TranscodeAudio = MP3
DefaultVBVBufSize = true
MuxDTSToMpeg = true
H264LevelLimit = 5.1
StreamExtensions = mkv,hdmov,hdm,flac,fla,dts,ogg,asf,asx,m2v,mp4,mpg,mpeg,avi,mov,wmv
ChunkedTransfer = true
HalveBitrate = true
