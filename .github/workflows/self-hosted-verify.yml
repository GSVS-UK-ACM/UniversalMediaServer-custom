name: Self-hosted Linux verification

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/**'
    paths:
      - '.github/workflows/self-hosted-verify.yml'
      - 'pom.xml'
      - 'react-client/**'
      - 'scripts/ci/**'
      - 'src/**'
      - 'tv-app/**'

permissions:
  contents: read

concurrency:
  group: ums-custom-self-hosted
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor == github.repository_owner
    name: Linux Java verification
    runs-on: [self-hosted, Linux, X64, ums-custom-ci]
    timeout-minutes: 90
    env:
      JAVA_TOOL_OPTIONS: -Dums.profile.path=${{ github.workspace }}/.ci-profile/UMS.conf
    steps:
      - name: Checkout exact requested commit
        uses: actions/checkout@v7
        with:
          clean: true
          persist-credentials: false

      - name: Prepare persistent workspace
        run: bash scripts/ci/clean-self-hosted-runner.sh

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: 17
          cache: maven

      - name: Record toolchain
        run: |
          java -version
          mvn -version
          ffmpeg -version | sed -n '1p'
          git rev-parse HEAD

      - name: Run custom-fork regression tests
        run: mvn --batch-mode -P testing '-Dtest=RealFolderThumbnailTest,RendererPlaybackModeTest,RendererConfigurationTest,ServerIconProviderTest,SamsungFolderArtworkTest' test

      - name: Set up TV app test runtime
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check and build Samsung TV app
        working-directory: tv-app
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          npm run build

      - name: Run Linux verification
        # UMS tests replace process-wide configuration and engine state. A new
        # JVM per test class prevents that state leaking into later classes.
        run: mvn --batch-mode verify -P testing -DdisableXmlReport=true -DreuseForks=false

      - name: Check patch whitespace
        run: git diff --check

      - name: Clean persistent workspace
        if: always()
        run: bash scripts/ci/clean-self-hosted-runner.sh
